[project]
name = "boario"
description = "BoARIO : The Adaptative Regional Input Output model in python."
authors = [{ name = "Samuel Juhel", email = "pro@sjuhel.org" }]
requires-python = ">=3.10,<4.0"
readme = "README.rst"
license = "GPL-3.0-or-later"
keywords = [
    "ario",
    "economics",
    "events",
    "extreme",
    "impact",
    "indirect",
    "input-output",
    "modeling",
    "mrio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "coloredlogs>=15.0.1,<16",
    "country-converter>=1.0.0,<2",
    "dask>=2023",
    "numpy<2.3",
    "odfpy>=1.4.1,<2",
    "pandas>=1.5",
    "progressbar2>=4.2.0,<5",
    "pyarrow>=11",
    "pymrio>=0.4",
]
dynamic = ["version"]

[project.urls]
"Bug Reports" = "https://github.com/spjuhel/BoARIO/issues"
Documentation = "https://spjuhel.github.io/BoARIO/index.html"
Homepage = "https://github.com/spjuhel/BoARIO"
Source = "https://github.com/spjuhel/BoARIO/"

[dependency-groups]
dev = [
    "pytest>=7.3.1,<10.0.0",
    "pygit2>=1.12.1,<2",
    "ipykernel>=6.23,<8.0",
    "black>=23.3,<27.0",
    "sphinxcontrib-bibtex>=2.5.0,<3",
    "sphinx-autoapi>=2.1,<4.0",
    "sphinx-automodapi>=0.15,<0.23",
    "sphinx-copybutton>=0.5.2,<0.6",
    "pydata-sphinx-theme>=0.13.3,<0.20.0",
    "nbsphinx>=0.9.2,<0.10",
    "pytest-cov>=4.1,<8.0",
    "isort>=5.13.2,<10.0.0",
    "flake8>=7.0.0,<8",
    "flake8-pyproject>=1.2.3,<2",
    "safety>=3.0.1,<4",
    "pydoclint>=0.4.1,<0.11.0",
    "autoapi>=2.0.1,<3",
    "sphinx-autodoc-typehints>=2,<4",
    "numpydoc>=1.7.0,<2",
    "pre-commit>=3.7.1,<5.0.0",
    "sphinx-design>=0.6.1,<0.7",
    "setuptools-scm>=8.3.1,<11.0.0",
    "ty>=0.0.93",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.uv]
default-groups = "all"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["boario"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)

[build-system]
requires = ["poetry-core","setuptools>=61", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/",
    "api-examples",
    "docs/",
    "dist/",
    "imgs/",
    "other/",
    "tests/",
    "dist/"
]

[tool.pytest.ini_options]
addopts = "--cov=boario --cov-report html --cov-report json --cov-report lcov"
filterwarnings = [
         "ignore::DeprecationWarning",
         "ignore::FutureWarning"
         ]

log_level="DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "logs/pytest-logs.txt"
